# For the `alembic` CLI, run from server/ (e.g. `uv run alembic revision
# --autogenerate -m "add feedback"`). It connects to $DATABASE_URL (or
# server/.env). Deploys and the app use `python -m holt_server.migrate`.
[alembic]
script_location = holt_server:migrations
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
