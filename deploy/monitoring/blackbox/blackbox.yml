# Probes prometheus asks the blackbox exporter to make (prometheus.yml).
modules:
  # Is a page there: any 2xx, over IPv4, within 10 seconds.
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: true
  # /__build says how auto-deploy stands (deploy/prod/follow.sh). The probe
  # fails "due to regex" when the last deploy failed, or is being held back
  # because it failed. Not reaching /__build at all is the site-down alert's
  # business, not this one's.
  deploy_state:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      fail_if_body_matches_regexp:
        - '"(state|status)":\s*"(failed|held)"'
