# The failure this repository already had once: a passing-count sat in
# docs/research/REPRODUCTION.md while one of those tests was failing. `test_docs_claims.py`
# checks the number the guide promises against the number the suite *collects*,
# because a test that runs the whole suite inside itself does not terminate --
# so nothing was checking that the suite still passed. This is that check.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Build distributions
        run: uv build

      - name: Check distribution contents
        run: uv run --no-project python scripts/check_dist.py dist

      - name: Install and smoke-test the wheel
        run: |
          uv venv .release-venv
          uv pip install --python .release-venv/bin/python dist/*.whl
          .release-venv/bin/python -c "import holt.tui.app"
          .release-venv/bin/holt --help

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Tests
        run: uv run pytest -rs

      # The no-key paths remain part of the product contract even though PyPI
      # installs are aimed at live use.
      - name: No-key smoke tests
        run: |
          PYTHONPATH=. uv run holt analyze NixOS/nixpkgs --replay
          PYTHONPATH=. uv run python eval/harness.py --replay --run-tag run1

      # Offline. Fails on any verdict or count on the golden set that changed
      # without `python -m golden approve --reason` (golden/README.md). The
      # pytest run above checks the same thing; this prints the table.
      - name: Golden set
        run: uv run python -m golden check

  # The server's tests again, on the database production runs. The app's
  # startup migrates it from empty, so the migrations are exercised too.
  server-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: holt
          POSTGRES_PASSWORD: holt
          POSTGRES_DB: holt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U holt -d holt"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      HOLT_TEST_DATABASE_URL: postgresql+asyncpg://holt:holt@127.0.0.1:5432/holt
      DATABASE_URL: postgresql+asyncpg://holt:holt@127.0.0.1:5432/holt
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Migrate an empty database and compare it with the models
        working-directory: server
        run: |
          uv run python -m holt_server.migrate
          uv run python -m holt_server.migrate check

      - name: Server tests
        run: uv run pytest -rs server/tests
